```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Home IoT Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Segoe UI;
margin:0;
background:#0f172a;
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#1e293b;
font-size:22px;
font-weight:bold;
}

.status{
color:#22c55e;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.icon{
font-size:45px;
margin-bottom:10px;
}

.on{
color:#facc15;
text-shadow:0 0 20px #facc15;
}

.off{
color:#64748b;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.chart-box{
background:#1e293b;
margin:20px;
padding:25px;
border-radius:15px;
}

.monitor{
display:flex;
justify-content:space-around;
margin-top:20px;
}

.monitor div{
background:#0f172a;
padding:15px 25px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="header">
<div>🏠 Smart Home Dashboard</div>
<div class="status">by Nandatronik</div>
</div>

<div class="container">

<div class="card">
<div id="icon1" class="icon off">
<i class="fas fa-lightbulb"></i>
</div>
<h3>Lampu Ruang</h3>
<button onclick="toggleRelay('relay1')">Toggle</button>
</div>

<div class="card">
<div id="icon2" class="icon off">
<i class="fas fa-fan"></i>
</div>
<h3>Kipas</h3>
<button onclick="toggleRelay('relay2')">Toggle</button>
</div>

<div class="card">
<div id="icon3" class="icon off">
<i class="fas fa-lightbulb"></i>
</div>
<h3>Lampu Teras</h3>
<button onclick="toggleRelay('relay3')">Toggle</button>
</div>

<div class="card">
<div id="icon4" class="icon off">
<i class="fas fa-plug"></i>
</div>
<h3>Stop Kontak</h3>
<button onclick="toggleRelay('relay4')">Toggle</button>
</div>

</div>

<div class="chart-box">

<h3>Energy Consumption</h3>

<canvas id="powerChart"></canvas>

<div class="monitor">

<div>
⚡ Voltage  
<h2 id="volt">220 V</h2>
</div>

<div>
💧 Current  
<h2 id="amp">0.8 A</h2>
</div>

<div>
🔋 Power  
<h2 id="watt">180 W</h2>
</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDvrD2L0BBzlqa4RZ3oUXPNwNm3PMtJeGI",
  authDomain: "smart-home-4c042.firebaseapp.com",
  databaseURL: "https://smart-home-4c042-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "smart-home-4c042",
  storageBucket: "smart-home-4c042.firebasestorage.app",
  messagingSenderId: "1031572631040",
  appId: "1:1031572631040:web:68cdb8ca7621ae373132e5"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function toggleRelay(path){

const ref = db.ref(path);

ref.once("value").then(function(snapshot){

let val = snapshot.val();

ref.set(!val);

});

}

const relays = [

{path:"relay1",icon:"icon1"},
{path:"relay2",icon:"icon2"},
{path:"relay3",icon:"icon3"},
{path:"relay4",icon:"icon4"}

];

relays.forEach(r=>{

db.ref(r.path).on("value",function(snapshot){

let state = snapshot.val();

const icon = document.getElementById(r.icon);

if(state){

icon.classList.remove("off");
icon.classList.add("on");

}else{

icon.classList.remove("on");
icon.classList.add("off");

}

});

});

const ctx = document.getElementById("powerChart");

const chart = new Chart(ctx,{

type:"line",

data:{
labels:["00","04","08","12","16","20"],
datasets:[{
label:"Power (W)",
data:[120,150,90,200,170,140],
borderWidth:3
}]
},

options:{
plugins:{legend:{labels:{color:"white"}}},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}

});

db.ref("sensor/voltage").on("value",snap=>{
document.getElementById("volt").innerHTML=snap.val()+" V";
});

db.ref("sensor/current").on("value",snap=>{
document.getElementById("amp").innerHTML=snap.val()+" A";
});

db.ref("sensor/power").on("value",snap=>{
document.getElementById("watt").innerHTML=snap.val()+" W";
});

</script>

</body>
</html>
