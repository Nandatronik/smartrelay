<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Home IoT Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Segoe UI;
margin:0;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:#1e293b;
padding:40px;
border-radius:20px;
text-align:center;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.icon{
font-size:90px;
margin-bottom:20px;
transition:0.3s;
}

.on{
color:#facc15;
text-shadow:0 0 30px #facc15;
}

.off{
color:#64748b;
}

.status{
margin-top:10px;
font-size:20px;
}

button{
margin-top:25px;
padding:14px 30px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2563eb;
transform:scale(1.05);
}

.footer{
margin-top:20px;
font-size:14px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<!-- LAMPU LUAR -->
<div class="card">

<div class="title">
🏠 Lampu Luar
</div>

<div id="icon1" class="icon off">
<i class="fas fa-lightbulb"></i>
</div>

<div id="status1" class="status">
OFF
</div>

<button onclick="toggleRelay('relay1')">
Toggle Lampu
</button>

<div class="footer">
Smart Home IoT
</div>

</div>

<!-- LAMPU BELAKANG -->
<div class="card">

<div class="title">
🌙 Lampu Belakang
</div>

<div id="icon2" class="icon off">
<i class="fas fa-lightbulb"></i>
</div>

<div id="status2" class="status">
OFF
</div>

<button onclick="toggleRelay('relay2')">
Toggle Lampu
</button>

<div class="footer">
Smart Home IoT
</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyDvrD2L0BBzlqa4RZ3oUXPNwNm3PMtJeGI",

authDomain: "smart-home-4c042.firebaseapp.com",

databaseURL: "https://smart-home-4c042-default-rtdb.europe-west1.firebasedatabase.app",

projectId: "smart-home-4c042",

storageBucket: "smart-home-4c042.firebasestorage.app",

messagingSenderId: "1031572631040",

appId: "1:1031572631040:web:68cdb8ca7621ae373132e5"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function toggleRelay(path){

const ref = db.ref(path);

ref.once("value").then(function(snapshot){

let val = snapshot.val();

ref.set(!val);

});

}

// RELAY 1
db.ref("relay1").on("value",function(snapshot){

let state = snapshot.val();

const icon = document.getElementById("icon1");
const status = document.getElementById("status1");

if(state){

icon.classList.remove("off");
icon.classList.add("on");

status.innerHTML = "ON";

}else{

icon.classList.remove("on");
icon.classList.add("off");

status.innerHTML = "OFF";

}

});

// RELAY 2
db.ref("relay2").on("value",function(snapshot){

let state = snapshot.val();

const icon = document.getElementById("icon2");
const status = document.getElementById("status2");

if(state){

icon.classList.remove("off");
icon.classList.add("on");

status.innerHTML = "ON";

}else{

icon.classList.remove("on");
icon.classList.add("off");

status.innerHTML = "OFF";

}

});

</script>

</body>
</html>
