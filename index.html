<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartHome IoT Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Segoe UI;
margin:0;
background:#0f172a;
color:white;
text-align:center;
}

/* HEADER */

.header{
padding:20px;
font-size:26px;
font-weight:bold;
background:#1e293b;
}

/* CARD */

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.card{
background:#1e293b;
width:220px;
padding:25px;
margin:15px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.icon{
font-size:45px;
margin-bottom:10px;
transition:0.3s;
}

.on{
color:#facc15;
animation: glow 1s infinite alternate;
}

.off{
color:#64748b;
}

@keyframes glow{

from{ text-shadow:0 0 5px #facc15;}
to{ text-shadow:0 0 20px #facc15;}

}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
cursor:pointer;
}

/* GRAPH */

.chart-container{
width:90%;
max-width:800px;
margin:40px auto;
background:#1e293b;
padding:20px;
border-radius:12px;
}

</style>
</head>

<body>

<div class="header">
SmartHome IoT Dashboard
</div>

<div class="container">

<div class="card">

<div id="icon1" class="icon off">
<i class="fas fa-lightbulb"></i>
</div>

<h3>Lampu Ruang</h3>

<button onclick="toggleRelay('relay1')">
Toggle
</button>

</div>

<div class="card">

<div id="icon2" class="icon off">
<i class="fas fa-fan"></i>
</div>

<h3>Kipas</h3>

<button onclick="toggleRelay('relay2')">
Toggle
</button>

</div>

<div class="card">

<div id="icon3" class="icon off">
<i class="fas fa-lightbulb"></i>
</div>

<h3>Lampu Teras</h3>

<button onclick="toggleRelay('relay3')">
Toggle
</button>

</div>

<div class="card">

<div id="icon4" class="icon off">
<i class="fas fa-plug"></i>
</div>

<h3>Stop Kontak</h3>

<button onclick="toggleRelay('relay4')">
Toggle
</button>

</div>

</div>

<!-- GRAFIK LISTRIK -->

<div class="chart-container">

<h3>Grafik Penggunaan Listrik</h3>

<canvas id="powerChart"></canvas>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyDvrD2L0BBzlqa4RZ3oUXPNwNm3PMtJeGI",
  authDomain: "smart-home-4c042.firebaseapp.com",
  databaseURL: "https://smart-home-4c042-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "smart-home-4c042",
  storageBucket: "smart-home-4c042.firebasestorage.app",
  messagingSenderId: "1031572631040",
  appId: "1:1031572631040:web:68cdb8ca7621ae373132e5"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* RELAY CONTROL */

function toggleRelay(path){

const ref = db.ref("/"+path);

ref.get().then(snap=>{
ref.set(!snap.val());
});

}

/* REALTIME STATUS */

const relays = [

{path:"relay1", icon:"icon1"},
{path:"relay2", icon:"icon2"},
{path:"relay3", icon:"icon3"},
{path:"relay4", icon:"icon4"}

];

relays.forEach(r=>{

db.ref("/"+r.path).on("value",snap=>{

let state = snap.val();

const icon = document.getElementById(r.icon);

if(state){

icon.classList.remove("off");
icon.classList.add("on");

}else{

icon.classList.remove("on");
icon.classList.add("off");

}

});

});

/* GRAFIK LISTRIK */

const ctx = document.getElementById("powerChart");

const powerChart = new Chart(ctx,{

type:"line",

data:{

labels:["00","04","08","12","16","20"],

datasets:[{

label:"Watt",

data:[120,150,90,200,170,140],

borderWidth:3,
fill:false

}]

},

options:{

plugins:{
legend:{labels:{color:"white"}}
},

scales:{

x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}

}

}

});

</script>

</body>
</html>
