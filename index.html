<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>SmartHome IoT Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
margin:0;
background:linear-gradient(120deg,#1e3c72,#2a5298);
color:#333;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}

/* HEADER */

.header{
width:100%;
padding:20px;
text-align:center;
color:white;
font-size:26px;
font-weight:600;
letter-spacing:1px;
}

/* LOGIN */

#loginForm{
background:white;
padding:35px;
border-radius:12px;
width:360px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
margin-top:40px;
}

#loginForm h2{
text-align:center;
margin-bottom:25px;
}

#loginForm input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

#loginForm button{
width:100%;
padding:12px;
background:#2a5298;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

#loginForm button:hover{
background:#1e3c72;
}

/* DASHBOARD */

#dashboard{
display:none;
width:100%;
max-width:1100px;
}

.relay-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:30px;
}

/* CARD */

.card{
background:white;
width:230px;
margin:15px;
padding:25px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:10px;
}

.status{
padding:5px 15px;
border-radius:20px;
color:white;
font-weight:bold;
font-size:14px;
display:inline-block;
margin-bottom:15px;
}

.on{
background:#2ecc71;
}

.off{
background:#e74c3c;
}

.card button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

.btn-on{
background:#2ecc71;
}

.btn-off{
background:#3498db;
}

/* CONTROL BUTTON */

.controls{
text-align:center;
margin-top:20px;
}

.controls button{
padding:12px 25px;
border:none;
border-radius:8px;
font-size:15px;
color:white;
cursor:pointer;
margin:8px;
}

#allOffBtn{
background:#e74c3c;
}

#logoutBtn{
background:#555;
}

/* FOOTER */

footer{
margin-top:auto;
padding:15px;
color:white;
font-size:14px;
}

@media(max-width:600px){

.card{
width:90%;
}

#loginForm{
width:90%;
}

}

</style>
</head>

<body>

<div class="header">
SmartHome IoT Dashboard
</div>

<!-- LOGIN -->
<div id="loginForm">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="relay-container">

<div class="card">
<h3>Relay 1</h3>
<div id="status1" class="status off">OFF</div>
<button id="btn1" class="btn-off">Toggle</button>
</div>

<div class="card">
<h3>Relay 2</h3>
<div id="status2" class="status off">OFF</div>
<button id="btn2" class="btn-off">Toggle</button>
</div>

<div class="card">
<h3>Relay 3</h3>
<div id="status3" class="status off">OFF</div>
<button id="btn3" class="btn-off">Toggle</button>
</div>

<div class="card">
<h3>Relay 4</h3>
<div id="status4" class="status off">OFF</div>
<button id="btn4" class="btn-off">Toggle</button>
</div>

</div>

<div class="controls">

<button id="allOffBtn">All Device OFF</button>
<button id="logoutBtn">Logout</button>

</div>

</div>

<footer>
Created by Nandatronik
</footer>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

<script>

// FIREBASE CONFIG

const firebaseConfig = {
apiKey: "AIzaSyDvrD2L0BBzlqa4RZ3oUXPNwNm3PMtJeGI",
authDomain: "smart-home-4c042.firebaseapp.com",
databaseURL: "https://smart-home-4c042-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "smart-home-4c042",
storageBucket: "smart-home-4c042.firebasestorage.app",
messagingSenderId: "1031572631040",
appId: "1:1031572631040:web:68cdb8ca7621ae373132e5"
};

firebase.initializeApp(firebaseConfig);

const allowedEmail="admin@gmail.com";
const allowedPassword="admin123";

const loginBtn=document.getElementById("loginBtn");
const loginForm=document.getElementById("loginForm");
const dashboard=document.getElementById("dashboard");

loginBtn.onclick=()=>{

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

if(email===allowedEmail && password===allowedPassword){

firebase.auth().signInWithEmailAndPassword(email,password)
.then(()=>{

loginForm.style.display="none";
dashboard.style.display="block";
startRelay();

})
.catch(e=>alert(e.message));

}else{

alert("Email atau Password salah");

}

};

function startRelay(){

const db=firebase.database();

const relays=[
{id:1,path:"relay1"},
{id:2,path:"relay2"},
{id:3,path:"relay3"},
{id:4,path:"relay4"}
];

relays.forEach(relay=>{

const status=document.getElementById("status"+relay.id);
const btn=document.getElementById("btn"+relay.id);

const ref=db.ref("/"+relay.path);

ref.on("value",snap=>{

let state=snap.val();

if(state){

status.innerText="ON";
status.className="status on";
btn.className="btn-on";

}else{

status.innerText="OFF";
status.className="status off";
btn.className="btn-off";

}

});

btn.onclick=()=>{

ref.get().then(snap=>{

ref.set(!snap.val());

});

};

});

document.getElementById("allOffBtn").onclick=()=>{

relays.forEach(r=>{

db.ref("/"+r.path).set(false);

});

};

}

document.getElementById("logoutBtn").onclick=()=>{

firebase.auth().signOut().then(()=>{

dashboard.style.display="none";
loginForm.style.display="block";

});

};

</script>

</body>
</html>
